server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: inventory-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:inventory}
    username: ${POSTGRES_USER:inventory}
    password: ${POSTGRES_PASSWORD:changeme}

  jpa:
    open-in-view: false
    hibernate:
      # Never DDL auto-generation - Flyway owns every schema change, in every environment,
      # local dev included. See docs/conventions/data-and-infra.md.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short on purpose: the rate limiter must fail open fast, not hang the request,
      # if Redis is unreachable - see RedisRateLimiter.
      timeout: 250ms

  cache:
    type: redis

app:
  security:
    jwt:
      # HMAC-SHA256 signing secret for this application's own access tokens - see
      # docs/security.md. The default below is fine for local dev only; every real
      # deployment MUST override it via JWT_SECRET, or every environment sharing this
      # default would accept each other's tokens.
      secret: ${JWT_SECRET:please-change-this-default-signing-secret-in-production}
      issuer: ${JWT_ISSUER:inventory-api}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    bootstrap-admin:
      # If set and the users table is empty at startup, AdminBootstrapRunner creates this
      # one ADMIN - the only way to get a first user into this application. Blank by
      # default: no admin is silently created with a guessable credential.
      email: ${APP_ADMIN_EMAIL:}
      password: ${APP_ADMIN_PASSWORD:}

  rate-limit:
    # POST /api/v1/auth/login only, keyed by caller IP - see LoginRateLimitFilter.
    login:
      max-requests: ${RATE_LIMIT_LOGIN_MAX_REQUESTS:10}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    # Every authenticated business endpoint, keyed by caller user id - see
    # docs/conventions/data-and-infra.md's "Rate limiting" section. Generous by default
    # so it only matters for genuine abuse, not normal use.
    api-wide:
      max-requests: ${RATE_LIMIT_API_WIDE_MAX_REQUESTS:300}
      window-seconds: ${RATE_LIMIT_API_WIDE_WINDOW_SECONDS:60}

  cors:
    # Empty by default - the mechanism is wired into SecurityConfig, but nothing is
    # allowed cross-origin until a real frontend origin is set.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  webhooks:
    # See docs/specs/14-webhooks/requirements.md's "Decision" - the dispatcher is a
    # @Scheduled background job, never anything a business-endpoint request waits on.
    dispatch-interval-ms: ${WEBHOOKS_DISPATCH_INTERVAL_MS:15000}
    dispatch-batch-size: ${WEBHOOKS_DISPATCH_BATCH_SIZE:50}
    delivery-timeout-ms: ${WEBHOOKS_DELIVERY_TIMEOUT_MS:5000}
    max-attempts: ${WEBHOOKS_MAX_ATTEMPTS:10}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
